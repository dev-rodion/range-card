<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range Card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: dark;
    --ground:#101418;
    --panel:#161b21;
    --panel-2:#1b2128;
    --line:#2a323b;
    --ink:#e8ecef;
    --muted:#8b97a3;
    --accent:#d9c08a;
    --bad:#c96a5a;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    padding:24px 16px 32px;
  }
  main{width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

  .field{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field:focus-within{border-color:var(--accent)}
  .field.err{border-color:var(--bad)}
  .cap{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  .field.err .cap{color:var(--bad)}
  input{
    width:100%;
    min-width:0;
    border:0;
    background:transparent;
    color:var(--ink);
    font-family:var(--mono);
    font-size:18px;
    font-weight:500;
    padding:0;
    outline:none;
    font-variant-numeric:tabular-nums;
  }
  input::placeholder{color:#4e5963}

  .targets{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .targets > .cap{padding:12px 14px 0}

  .row{
    display:grid;
    grid-template-columns:18px minmax(0,1fr) auto 22px;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-top:1px solid transparent;
  }
  .row + .row{border-top-color:var(--line)}
  .row:focus-within{background:#202730}
  .row .idx{
    font-family:var(--mono);
    font-size:12px;
    color:#5f6b76;
    font-variant-numeric:tabular-nums;
  }
  .row input{font-size:17px}
  .row.err input{color:var(--bad)}
  .row .dist{
    font-family:var(--mono);
    font-size:23px;
    font-weight:600;
    color:var(--accent);
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .row .dist.dim{color:#3d464f;font-weight:400}
  .row .dist .u{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
  .row .del{
    width:22px;height:22px;padding:0;
    border:0;background:transparent;
    color:#454f59;
    font-family:var(--mono);font-size:15px;line-height:1;
    cursor:pointer;border-radius:5px;
    opacity:0;
  }
  .row:hover .del,.row:focus-within .del{opacity:1}
  .del:hover{color:var(--bad);background:#22282f}

  .foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    font-size:11px;
    color:#5f6b76;
    font-family:var(--mono);
  }
  .foot button{
    font:inherit;
    color:#5f6b76;
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 9px;
    cursor:pointer;
  }
  .foot button:hover{color:var(--ink);border-color:#3c464f}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="field" id="f-gun">
    <span class="cap"><label for="gun">Gun</label></span>
    <input id="gun" inputmode="text" spellcheck="false" autocomplete="off" placeholder="paste coordinates">
  </div>

  <div class="targets">
    <span class="cap">Targets</span>
    <div id="rows"></div>
  </div>

  <div class="foot">
    <span id="hint">1 unit = 100 m · Enter adds a line</span>
    <button id="clear" type="button">Clear targets</button>
  </div>
</main>

<script>
(function(){
  var K_GUN = 'rangecard.gun', K_TGT = 'rangecard.targets';
  var gun = document.getElementById('gun');
  var fGun = document.getElementById('f-gun');
  var rows = document.getElementById('rows');
  var hint = document.getElementById('hint');

  function store(k, v){ try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  function parse(s){
    s = String(s || '');
    if(!/\d/.test(s)) return null;
    s = s.replace(/[^0-9.,+\-]/g, ' ');
    var dot = s.match(/-?\d+(?:\.\d+)?/g) || [];
    var any = s.match(/-?\d+(?:[.,]\d+)?/g) || [];
    var pick = null;
    if(any.length === 2) pick = any;
    else if(dot.length === 2) pick = dot;
    else if(any.length > 2) pick = any;
    else if(dot.length > 2) pick = dot;
    if(!pick) return null;
    var x = parseFloat(String(pick[0]).replace(',', '.'));
    var y = parseFloat(String(pick[1]).replace(',', '.'));
    if(!isFinite(x) || !isFinite(y)) return null;
    return [x, y];
  }

  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

  function rowList(){ return Array.prototype.slice.call(rows.children); }

  function makeRow(value){
    var row = document.createElement('div');
    row.className = 'row';

    var idx = document.createElement('span');
    idx.className = 'idx';

    var input = document.createElement('input');
    input.type = 'text';
    input.spellcheck = false;
    input.autocomplete = 'off';
    input.placeholder = 'paste coordinates';
    input.value = value || '';
    input.setAttribute('aria-label', 'Target coordinates');

    var dist = document.createElement('span');
    dist.className = 'dist dim';
    dist.textContent = '—';

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '×';
    del.setAttribute('aria-label', 'Delete target');

    row.appendChild(idx); row.appendChild(input); row.appendChild(dist); row.appendChild(del);

    input.addEventListener('input', function(){ touched(); calcRow(row); ensureTail(); save(); });
    input.addEventListener('focus', function(){ input.select(); });
    input.addEventListener('mouseup', function(e){ e.preventDefault(); });

    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        var list = rowList(), i = list.indexOf(row);
        var next = list[i + 1] || rows.appendChild(makeRow(''));
        renumber();
        next.querySelector('input').focus();
      } else if(e.key === 'Backspace' && input.value === '' && rowList().length > 1){
        e.preventDefault();
        var l = rowList(), j = l.indexOf(row);
        row.remove();
        renumber(); save();
        var prev = rowList()[Math.max(0, j - 1)];
        if(prev) prev.querySelector('input').focus();
      }
    });

    input.addEventListener('paste', function(e){
      var text = (e.clipboardData || window.clipboardData).getData('text') || '';
      var lines = text.split(/[\r\n]+/).map(function(s){ return s.trim(); }).filter(Boolean);
      if(lines.length < 2) return;
      e.preventDefault();
      touched();
      input.value = lines[0];
      var anchor = row;
      for(var i = 1; i < lines.length; i++){
        var r = makeRow(lines[i]);
        anchor.parentNode.insertBefore(r, anchor.nextSibling);
        anchor = r;
      }
      calcAll(); ensureTail(); renumber(); save();
      anchor.querySelector('input').focus();
    });

    del.addEventListener('click', function(){
      if(rowList().length === 1){ input.value = ''; calcRow(row); save(); input.focus(); return; }
      row.remove(); renumber(); ensureTail(); save();
    });

    return row;
  }

  function calcRow(row){
    var input = row.querySelector('input');
    var dist = row.querySelector('.dist');
    var a = parse(gun.value), b = parse(input.value);
    row.classList.toggle('err', input.value.trim() !== '' && !b);
    if(!a || !b){
      dist.textContent = '—';
      dist.classList.add('dim');
      return;
    }
    var d = Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) * 100);
    dist.innerHTML = '';
    dist.appendChild(document.createTextNode(fmt(d)));
    var u = document.createElement('span');
    u.className = 'u'; u.textContent = 'm';
    dist.appendChild(u);
    dist.classList.remove('dim');
  }

  function calcAll(){
    fGun.classList.toggle('err', gun.value.trim() !== '' && !parse(gun.value));
    rowList().forEach(calcRow);
  }

  function renumber(){
    rowList().forEach(function(r, i){ r.querySelector('.idx').textContent = (i + 1) + '.'; });
  }

  function ensureTail(){
    var list = rowList();
    var last = list[list.length - 1];
    if(!last || last.querySelector('input').value.trim() !== ''){
      rows.appendChild(makeRow(''));
      renumber();
    }
  }

  function save(){
    store(K_GUN, gun.value);
    var vals = rowList().map(function(r){ return r.querySelector('input').value; })
                        .filter(function(v){ return v.trim() !== ''; });
    store(K_TGT, JSON.stringify(vals));
  }

  function touched(){ hint.textContent = '1 unit = 100 m · Enter adds a line'; }

  if(load(K_GUN) === null && load('wardogs_gun_pos') !== null){
    store(K_GUN, load('wardogs_gun_pos'));
    if(load('wardogs_targets') !== null) store(K_TGT, load('wardogs_targets'));
  }

  var savedGun = load(K_GUN), savedTgt = null;
  try{ savedTgt = JSON.parse(load(K_TGT) || 'null'); }catch(e){}

  if(savedGun !== null) gun.value = savedGun;
  (Array.isArray(savedTgt) ? savedTgt : []).forEach(function(v){ rows.appendChild(makeRow(v)); });
  ensureTail();
  renumber();
  calcAll();

  gun.addEventListener('input', function(){ touched(); calcAll(); save(); });
  gun.addEventListener('focus', function(){ gun.select(); });
  gun.addEventListener('mouseup', function(e){ e.preventDefault(); });
  gun.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); rowList()[0].querySelector('input').focus(); }
  });

  document.getElementById('clear').addEventListener('click', function(){
    rowList().forEach(function(r){ r.remove(); });
    ensureTail(); renumber(); calcAll(); touched(); save();
    rowList()[0].querySelector('input').focus();
  });

  (gun.value.trim() ? rowList()[rowList().length - 1].querySelector('input') : gun).focus();
})();
</script>
</body>
</html>
